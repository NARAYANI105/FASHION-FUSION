<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fashion Fusion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{
background:linear-gradient(135deg,#111,#222,#333);
color:#fff;
overflow-x:hidden;
}
nav{
position:sticky;top:0;
display:flex;justify-content:space-between;align-items:center;
padding:15px 30px;
background:rgba(0,0,0,.7);
backdrop-filter:blur(10px);
z-index:100;
}
nav a{
color:#fff;text-decoration:none;margin:0 10px;
transition:.3s;
}
nav a:hover{color:gold}
.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
animation:fadeIn 1s;
}
.hero h1{
font-size:4rem;
background:linear-gradient(to right,gold,pink);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.hero p{margin:20px}
.btn{
padding:12px 25px;
border:none;
border-radius:25px;
cursor:pointer;
background:gold;
font-weight:bold;
transition:.3s;
}
.btn:hover{
transform:scale(1.08);
}
section{
padding:60px 20px;
}
.search{
display:flex;
justify-content:center;
margin-bottom:20px;
}
.search input{
padding:12px;
width:300px;
border:none;
border-radius:20px;
}
.filters{
text-align:center;
margin-bottom:20px;
}
.filters button{
margin:5px;
padding:10px 20px;
border:none;
border-radius:20px;
cursor:pointer;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}
.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
padding:15px;
border-radius:20px;
text-align:center;
transition:.4s;
}
.card:hover{
transform:translateY(-10px) scale(1.03);
}
.card img{
width:100%;
height:250px;
object-fit:cover;
border-radius:15px;
}
.price{
color:gold;
font-size:1.2rem;
margin:10px 0;
}
.cart{
position:fixed;
right:20px;
bottom:20px;
background:gold;
color:#000;
padding:15px;
border-radius:50%;
font-weight:bold;
}
.about,.contact{
max-width:800px;
margin:auto;
text-align:center;
}
.contact input,.contact textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
}
footer{
text-align:center;
padding:20px;
background:#000;
}
@keyframes fadeIn{
from{opacity:0;transform:translateY(50px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<nav>
<h2>Fashion Fusion</h2>
<div>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#about">About</a>
<a href="#contact">Contact</a>
</div>
</nav>

<section class="hero" id="home">
<h1>Fashion Fusion</h1>
<p>Discover the Latest Trends</p>
<a href="#products"><button class="btn">Shop Now</button></a>
</section>

<section id="products">
<h2 style="text-align:center;margin-bottom:20px">Products</h2>

<div class="search">
<input id="search" placeholder="Search products...">
</div>

<div class="filters">
<button onclick="filterProducts('all')">All</button>
<button onclick="filterProducts('Men')">Men</button>
<button onclick="filterProducts('Women')">Women</button>
<button onclick="filterProducts('Shoes')">Shoes</button>
</div>

<div class="grid" id="productGrid"></div>
</section>

<section id="about">
<div class="about">
<h2>About Fashion Fusion</h2>
<br>
<p>
Fashion Fusion is a modern fashion catalog showcasing stylish clothing,
footwear and accessories with an engaging shopping experience.
</p>
</div>
</section>

<section id="contact">
<div class="contact">
<h2>Contact Us</h2>
<input placeholder="Name">
<input placeholder="Email">
<textarea rows="5" placeholder="Message"></textarea>
<button class="btn">Send</button>
</div>
</section>

<div class="cart" id="cartCount">0</div>

<footer>
© 2026 Fashion Fusion
</footer>

<script>
const products=[
{
name:"Men's Jacket",
category:"Men",
price:2999,
image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"
},
{
name:"Women's Dress",
category:"Women",
price:2499,
image:"https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=500"
},
{
name:"Running Shoes",
category:"Shoes",
price:1999,
image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
},
{
name:"Casual Shirt",
category:"Men",
price:1499,
image:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=500"
},
{
name:"Handbag",
category:"Women",
price:1899,
image:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500"
},
{
name:"Sneakers",
category:"Shoes",
price:2199,
image:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500"
}
];

let cart=0;

function displayProducts(data){
const grid=document.getElementById("productGrid");
grid.innerHTML="";

data.forEach(p=>{
grid.innerHTML+=`
<div class="card">
<img src="${p.image}" loading="lazy">
<h3>${p.name}</h3>
<div class="price">₹${p.price}</div>
<button class="btn" onclick="addCart()">Add To Cart</button>
</div>
`;
});
}

function filterProducts(cat){
if(cat==="all"){
displayProducts(products);
return;
}
displayProducts(products.filter(p=>p.category===cat));
}

function addCart(){
cart++;
document.getElementById("cartCount").innerText=cart;
}

document.getElementById("search").addEventListener("input",e=>{
const value=e.target.value.toLowerCase();
displayProducts(
products.filter(p=>
p.name.toLowerCase().includes(value)
)
);
});

displayProducts(products);
</script>

</body>
</html>
